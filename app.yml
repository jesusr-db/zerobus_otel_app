command: [
  "uvicorn",
  "server.app:app"
]

env:
  - name: CATALOG_NAME
    value: jmr_demo
  - name: SCHEMA_NAME
    value: zerobus_sdp
  - name: DATA_BACKEND
    value: lakebase
  - name: LAKEBASE_INSTANCE_NAME
    value: zerobus-dev
  - name: LAKEBASE_DATABASE_NAME
    value: zerobus_sdp
  - name: LAKEBASE_CATALOG_NAME
    value: zerobus_sdp
  - name: LAKEBASE_SCHEMA_NAME
    value: zerobus_sdp
  - name: LAKEBASE_HOST
    value: instance-c33627a6-422c-461a-82f7-ac78b0a6d72a.database.cloud.databricks.com
  - name: LAKEBASE_PORT
    value: "5432"

resources:
  - name: lakebase-instance
    database_instance:
      id: zerobus-dev
      permission: CAN_USE
  - name: warehouse
    sql_warehouse:
      auto_detect: true
      permission: CAN_USE
