# Databricks Jobs for Observability Pipeline
# All jobs use serverless compute for cost optimization and faster startup

resources:
  jobs:
    # =======================================================================
    # SYNCED TABLES SETUP (On-demand)
    # =======================================================================
    setup_synced_tables:
      name: "[${bundle.target}] Setup Synced Tables"

      environments:
        - environment_key: synced_tables_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0

      tasks:
        - task_key: create_synced_tables
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/setup_synced_tables.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

      max_concurrent_runs: 1
      timeout_seconds: 1800

      tags:
        environment: ${bundle.target}
        layer: setup
        team: data-engineering
        usecase: otel

    # =======================================================================
    # DESTROY SYNCED TABLES (On-demand)
    # =======================================================================
    destroy_synced_tables:
      name: "[${bundle.target}] Destroy Synced Tables"

      environments:
        - environment_key: synced_tables_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0

      tasks:
        - task_key: destroy_synced_tables
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/destroy_synced_tables.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

      max_concurrent_runs: 1
      timeout_seconds: 600

      tags:
        environment: ${bundle.target}
        layer: cleanup
        team: data-engineering
        usecase: otel

    # =======================================================================
    # FULL PIPELINE SETUP (On-demand, idempotent)
    # Ensures continuous pipelines are running (starts them if not),
    # sets up synced tables, and grants app permissions.
    #
    #   ensure_silver_running ──> ensure_gold_running ──┐
    #              |                                     ├──> sync_service_dependencies ──┐
    #              └──> setup_synced_tables ─────────────├──> sync_traces_assembled ──────├──> grant_app_permissions
    # =======================================================================
    full_pipeline_setup:
      name: "[${bundle.target}] Full Pipeline Setup"

      environments:
        - environment_key: pipeline_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0
        - environment_key: synced_tables_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0
        - environment_key: grant_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0
              - psycopg2-binary

      tasks:
        # Phase 1: Ensure continuous pipelines are running (no-op if already running)
        - task_key: ensure_silver_running
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../pipeline/scripts/ensure_pipeline_running.py
            base_parameters:
              pipeline_id: ${resources.pipelines.silver_streaming_pipeline.id}
              pipeline_name: "Silver Streaming Pipeline"

        - task_key: ensure_gold_running
          depends_on:
            - task_key: ensure_silver_running
          environment_key: pipeline_env
          notebook_task:
            notebook_path: ../pipeline/scripts/ensure_pipeline_running.py
            base_parameters:
              pipeline_id: ${resources.pipelines.gold_aggregations_pipeline.id}
              pipeline_name: "Gold Aggregations Pipeline"

        # Phase 2: Setup synced tables (needs silver tables to exist)
        - task_key: setup_synced_tables
          depends_on:
            - task_key: ensure_silver_running
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/setup_synced_tables.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

        # Phase 3: Sync gold tables (after gold pipeline + synced tables)
        - task_key: sync_service_dependencies
          depends_on:
            - task_key: ensure_gold_running
            - task_key: setup_synced_tables
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/setup_service_dependencies_sync.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

        - task_key: sync_traces_assembled
          depends_on:
            - task_key: ensure_gold_running
            - task_key: setup_synced_tables
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/setup_traces_assembled_sync.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

        # Phase 4: Grant permissions (after ALL synced tables are created)
        - task_key: grant_app_permissions
          depends_on:
            - task_key: sync_service_dependencies
            - task_key: sync_traces_assembled
          environment_key: grant_env
          notebook_task:
            notebook_path: ../notebooks/grant_lakebase_permissions.py
            base_parameters:
              APP_NAME: o11y-jmr
              LAKEBASE_INSTANCE_NAME: "${var.database_instance_name}"
              LAKEBASE_DATABASE_NAME: "${var.schema_name}"
              LAKEBASE_SCHEMA_NAME: "${var.schema_name}"

      max_concurrent_runs: 1
      timeout_seconds: 7200

      tags:
        environment: ${bundle.target}
        layer: setup
        team: data-engineering
        usecase: otel

    # =======================================================================
    # DEV JOB (Scheduled health check)
    # Pipelines run continuously. This job only ensures synced tables
    # exist and are healthy.
    # =======================================================================
    dev_job:
      name: "[${bundle.target}] Dev Pipeline"

      schedule:
        quartz_cron_expression: "0 0 * * * ?"  # Every hour
        timezone_id: "UTC"
        pause_status: UNPAUSED

      environments:
        - environment_key: synced_tables_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0

      tasks:
        - task_key: sync_service_dependencies
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/setup_service_dependencies_sync.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

        - task_key: sync_traces_assembled
          environment_key: synced_tables_env
          notebook_task:
            notebook_path: ../pipeline/scripts/setup_traces_assembled_sync.py
            base_parameters:
              database_instance: "${var.database_instance_name}"
              catalog_name: "${var.catalog_name}"
              schema_name: "${var.schema_name}"

      max_concurrent_runs: 1
      timeout_seconds: 3600

      tags:
        environment: ${bundle.target}
        layer: dev
        team: data-engineering
        usecase: otel
