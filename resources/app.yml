resources:
  apps:
    o11y_jmr_app:
      name: o11y-jmr
      description: Observability dashboard for distributed tracing and service metrics (Lakebase backend)
      source_code_path: ${workspace.file_path}
      config:
        # command: ["uvicorn","server.app:app"]
        command: ["opentelemetry-instrument", "uvicorn", "server.app:app"]
        env:
          - name: LAKEBASE_CATALOG_NAME
            value: ${var.schema_name}
          - name: LAKEBASE_SCHEMA_NAME
            value: ${var.schema_name}
          - name: ENVIRONMENT
            value: production
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: lakebase-db
          database:
            database_name: ${var.schema_name}
            instance_name: ${var.database_instance_name}
            permission: CAN_CONNECT_AND_CREATE

