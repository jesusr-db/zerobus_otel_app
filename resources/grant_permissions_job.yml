resources:
  jobs:
    grant_lakebase_permissions:
      name: "[${bundle.target}] Grant Lakebase Permissions"

      environments:
        - environment_key: grant_env
          spec:
            client: "1"
            dependencies:
              - databricks-sdk>=0.35.0
              - psycopg2-binary

      tasks:
        - task_key: grant_permissions
          environment_key: grant_env
          notebook_task:
            notebook_path: ../notebooks/grant_lakebase_permissions.py
            base_parameters:
              APP_NAME: o11y-jmr
              LAKEBASE_INSTANCE_NAME: ${var.database_instance_name}
              LAKEBASE_DATABASE_NAME: ${var.schema_name}
              LAKEBASE_SCHEMA_NAME: ${var.schema_name}

          timeout_seconds: 600

      max_concurrent_runs: 1

      tags:
        environment: ${bundle.target}
        layer: setup
        team: data-engineering
        usecase: otel
