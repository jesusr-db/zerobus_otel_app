resources:
  jobs:
    grant_lakebase_permissions:
      name: grant_lakebase_permissions_${bundle.target}
      
      tasks:
        - task_key: grant_permissions
          notebook_task:
            notebook_path: ../notebooks/grant_lakebase_permissions.py
            source: WORKSPACE
          
          timeout_seconds: 600
      
      parameters:
        - name: APP_NAME
          default: o11y-jmr
        - name: LAKEBASE_INSTANCE_NAME
          default: ${var.database_instance_name}
        - name: LAKEBASE_HOST
          default: ${var.database_host_name}
        - name: LAKEBASE_PORT
          default: "5432"
        - name: LAKEBASE_DATABASE_NAME
          default: ${var.dest_schema_name}
        - name: LAKEBASE_SCHEMA_NAME
          default: ${var.dest_schema_name}
      
      max_concurrent_runs: 1
      
      tags:
        purpose: "Grant Lakebase permissions to app service principal"
        app: "o11y-jmr"
