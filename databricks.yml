bundle:
  name: o11y-jmr

include:
  - resources/*.yml

sync:
  include:
    - notebooks/*
    - src/notebooks/**
    - scripts/*

variables:
  # SQL Warehouse
  warehouse_id:
    description: SQL Warehouse ID for the app
    default: "5067b513037fbf07"

  # Unity Catalog - Target
  catalog_name:
    description: Catalog name for observability tables
    default: "jmr_demo"
  dest_schema_name:
    description: Schema name for observability tables (silver/gold output)
    default: "zerobus_sdp"

  # Lakebase Configuration
  database_instance_name:
    description: Lakebase instance name for synced tables
    default: "zerobus-otel"
  database_host_name:
    description: Lakebase host name
    default: "instance-80fb787b-dfab-43fc-a291-81aee89749b0.database.staging.cloud.databricks.com"

  # Bronze Layer Source
  bronze_catalog:
    description: Bronze layer catalog (source OTEL data)
    default: jmr_demo
  bronze_schema:
    description: Bronze layer schema
    default: zerobus
  bronze_table_prefix:
    description: Bronze table prefix
    default: otel

  # Alerting (optional)
  alert_webhook_url:
    description: Webhook URL for anomaly alerts (optional)
    default: ""
  alert_email:
    description: Email for job notifications (optional)
    default: ""

  # Checkpointing
  checkpoint_location:
    description: Volume path for streaming checkpoints
    default: "/Volumes/jmr_demo/zerobus/checkpoints/service_health"

targets:
  dev:
    mode: development
    default: true
    variables: 
      database_instance_name: "zerobus-dev"
      database_host_name: "instance-b84928e9-0966-4791-a9a7-bd0006b3c781.database.cloud.databricks.com"
      warehouse_id: "5067b513037fbf07"


  dogfood:
    mode: development

    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com

    variables:
      catalog_name: main
      dest_schema_name: dev_jesus_rodriguez_jmr_demo
      warehouse_id: "dd43ee29fedd958d"
      database_instance_name: "zerobus-otel"
      database_host_name: "instance-80fb787b-dfab-43fc-a291-81aee89749b0.database.staging.cloud.databricks.com"

  prod:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal_name}
